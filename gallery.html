<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | VU35KB - Srinivasan KB</title>
    <meta name="description" content="Explore the photo gallery of VU35KB: amateur radio station. View high-resolution images with details about each capture.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfdfd;
            --card-bg: #ffffff;
            --text: #171717;
            --text-muted: #737373;
            --accent: #0f172a;
            --accent-light: #f1f5f9;
            --card-shadow: 0 10px 40px -10px rgba(0,0,0,0.04);
        }
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:2rem 1.5rem;}
        .container {max-width:900px;width:100%;}
        header,footer {text-align:center;margin:2rem 0;}
        .gallery-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;}
        .gallery-item {position:relative;overflow:hidden;border-radius:8px;cursor:pointer;}
        .gallery-item img {width:100%;height:auto;display:block;transition:transform .3s;}
        .gallery-item:hover img {transform:scale(1.05);}
        .gallery-item .caption {position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);color:#fff;padding:0.4rem 0.6rem;font-size:0.9rem;}
        /* Modal */
        .modal {display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;}
        .modal-content {background:var(--card-bg);padding:1rem;border-radius:12px;max-width:90vw;max-height:90vh;overflow:auto;position:relative;}
        .modal-content img {width:100%;height:auto;display:block;object-fit:contain;}
        .modal-close {position:absolute;top:0.5rem;right:0.5rem;background:var(--accent);color:#fff;border:none;padding:0.3rem 0.6rem;border-radius:4px;cursor:pointer;}
        @media (max-width:1100px){body{padding:2rem 1rem;}}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Photo Gallery</h1>
    </header>
    <main>
        <section class="gallery-grid" id="gallery"></section>
    </main>
    <footer>
        <p><a href="index.html" style="color:var(--accent);text-decoration:none;">← Back to Home</a></p>
    </footer>
</div>
<div class="modal" id="modal">
    <div class="modal-content" id="modal-content">
        <button class="modal-close" id="modal-close">Close</button>
        <img id="modal-img" src="" alt="" />
        <h3 id="modal-title" style="margin-top:0.8rem;font-size:1.2rem;color:var(--text);"></h3>
        <p id="modal-desc" style="color:var(--text-muted);"></p>
    </div>
</div>
<script>
    // Fetch and render gallery items
    fetch('/gallery.json')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('gallery');
            data.sort((a, b) => new Date(b.date) - new Date(a.date));
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                const img = document.createElement('img');
                img.src = `/gallery_images/${item.filename}`;
                img.alt = item.title;
                img.loading = 'lazy';
                const cap = document.createElement('div');
                cap.className = 'caption';
                cap.textContent = item.title;
                div.appendChild(img);
                div.appendChild(cap);
                div.addEventListener('click', () => openModal(item));
                container.appendChild(div);
            });
        })
        .catch(err => console.error('Gallery load error', err));
    const modal=document.getElementById('modal');
    const modalImg=document.getElementById('modal-img');
    const modalTitle=document.getElementById('modal-title');
    const modalDesc=document.getElementById('modal-desc');
    const closeBtn=document.getElementById('modal-close');
    function openModal(item){
        modalImg.src=`src/gallery_images/${item.filename}`;
        modalImg.alt=item.title;
        modalTitle.textContent=item.title;
        modalDesc.textContent=item.description||'';
        modal.style.display='flex';
    }
    closeBtn.onclick=()=>{modal.style.display='none'};
    modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};
</script>
</body>
</html>
